name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run repository checks
        run: python scripts/validate_repo.py

      - name: Install official Agent Skills validator
        run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git@217be548739f21d6008915c29aefe320ea1a90af#subdirectory=skills-ref"

      - name: Validate Agent Skills specification
        run: skills-ref validate ./capability-loop
